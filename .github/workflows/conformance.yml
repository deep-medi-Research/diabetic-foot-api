name: conformance

on:
  push:
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 가짜 분석 프로그램으로 확인 도구 자체 시험
        run: python conformance/check_analyzer.py --self-test

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install jsonschema==4.23.0
      - name: 스키마를 draft 2020-12 메타 스키마로 확인
        run: |
          python - <<'PY'
          import glob, json
          from jsonschema import Draft202012Validator
          for path in sorted(glob.glob("schema/*.json")):
              with open(path, encoding="utf-8") as f:
                  Draft202012Validator.check_schema(json.load(f))
              print("ok", path)
          PY
